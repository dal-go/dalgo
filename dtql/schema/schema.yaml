$defs:
  aggregate:
    additionalProperties: false
    properties:
      args:
        items:
          $ref: '#/$defs/expression'
        maxItems: 1
        minItems: 1
        type: array
      distinct:
        type: boolean
      function:
        enum:
          - count
          - sum
          - avg
          - min
          - max
          - first
          - last
    required:
      - function
      - args
    type: object
  binary:
    additionalProperties: false
    properties:
      left:
        $ref: '#/$defs/expression'
      op:
        enum:
          - +
          - '-'
          - '*'
          - /
      right:
        $ref: '#/$defs/expression'
    required:
      - op
      - left
      - right
    type: object
  column:
    additionalProperties: false
    oneOf:
      - allOf:
          - required:
              - field
          - not:
              required:
                - wildcard
      - allOf:
          - not:
              required:
                - source
            required:
              - value
          - not:
              required:
                - wildcard
      - allOf:
          - not:
              required:
                - source
            required:
              - values
          - not:
              required:
                - wildcard
      - allOf:
          - not:
              required:
                - source
            required:
              - param
          - not:
              required:
                - wildcard
      - allOf:
          - not:
              required:
                - source
            required:
              - star
          - not:
              required:
                - wildcard
      - allOf:
          - not:
              required:
                - source
            required:
              - aggregate
          - not:
              required:
                - wildcard
      - allOf:
          - not:
              required:
                - source
            required:
              - binary
          - not:
              required:
                - wildcard
      - allOf:
          - not:
              required:
                - source
            required:
              - query
          - not:
              required:
                - wildcard
      - not:
          anyOf:
            - required:
                - field
            - required:
                - value
            - required:
                - values
            - required:
                - param
            - required:
                - star
            - required:
                - aggregate
            - required:
                - binary
            - required:
                - query
            - required:
                - source
            - required:
                - as
        required:
          - wildcard
    properties:
      aggregate:
        $ref: '#/$defs/aggregate'
      as:
        type: string
      binary:
        $ref: '#/$defs/binary'
      field:
        type: string
      param:
        pattern: ^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*$
        type: string
      query:
        $ref: '#/$defs/queryDocument'
      source:
        minLength: 1
        type: string
      star:
        const: true
      value:
        type:
          - string
          - number
          - boolean
          - "null"
      values:
        items:
          type:
            - string
            - number
            - boolean
            - "null"
        type: array
      wildcard:
        $ref: '#/$defs/wildcardProjection'
    type: object
  comparison:
    additionalProperties: false
    properties:
      left:
        $ref: '#/$defs/expression'
      op:
        enum:
          - <
          - <=
          - ==
          - '>'
          - '>='
          - In
          - NotIn
      right:
        $ref: '#/$defs/expression'
    required:
      - op
      - left
      - right
    type: object
  condition:
    oneOf:
      - $ref: '#/$defs/comparison'
      - $ref: '#/$defs/group'
      - additionalProperties: false
        properties:
          exists:
            $ref: '#/$defs/exists'
        required:
          - exists
        type: object
      - additionalProperties: false
        properties:
          notExists:
            $ref: '#/$defs/exists'
        required:
          - notExists
        type: object
  exists:
    additionalProperties: false
    properties:
      query:
        $ref: '#/$defs/queryDocument'
    required:
      - query
    type: object
  expression:
    additionalProperties: false
    oneOf:
      - required:
          - field
      - not:
          required:
            - source
        required:
          - value
      - not:
          required:
            - source
        required:
          - values
      - not:
          required:
            - source
        required:
          - param
      - not:
          required:
            - source
        required:
          - star
      - not:
          required:
            - source
        required:
          - aggregate
      - not:
          required:
            - source
        required:
          - binary
      - not:
          required:
            - source
        required:
          - query
    properties:
      aggregate:
        $ref: '#/$defs/aggregate'
      binary:
        $ref: '#/$defs/binary'
      field:
        type: string
      param:
        pattern: ^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*$
        type: string
      query:
        $ref: '#/$defs/queryDocument'
      source:
        minLength: 1
        type: string
      star:
        const: true
      value:
        type:
          - string
          - number
          - boolean
          - "null"
      values:
        items:
          type:
            - string
            - number
            - boolean
            - "null"
        type: array
    type: object
  from:
    additionalProperties: false
    not:
      required:
        - alias
        - as
    oneOf:
      - not:
          required:
            - query
        required:
          - name
      - not:
          required:
            - name
        required:
          - query
    properties:
      alias:
        type: string
      as:
        type: string
      database:
        minLength: 1
        type: string
      joins:
        items:
          $ref: '#/$defs/join'
        type: array
      name:
        minLength: 1
        type: string
      query:
        $ref: '#/$defs/queryDocument'
      scan:
        additionalProperties: false
        properties:
          limit:
            minimum: 1
            type: integer
          orderBy:
            items:
              $ref: '#/$defs/order'
            minItems: 1
            type: array
        required:
          - orderBy
          - limit
        type: object
      schema:
        minLength: 1
        type: string
    type: object
  group:
    additionalProperties: false
    oneOf:
      - required:
          - and
      - required:
          - or
    properties:
      and:
        items:
          $ref: '#/$defs/condition'
        type: array
      or:
        items:
          $ref: '#/$defs/condition'
        type: array
    type: object
  join:
    additionalProperties: false
    properties:
      from:
        $ref: '#/$defs/from'
      hints:
        $ref: '#/$defs/joinHints'
      "on":
        items:
          $ref: '#/$defs/joinComparison'
        minItems: 1
        type: array
      type:
        enum:
          - inner
          - left
    required:
      - from
      - "on"
    type: object
  joinComparison:
    additionalProperties: false
    properties:
      left:
        $ref: '#/$defs/qualifiedField'
      op:
        enum:
          - ==
          - eq
      right:
        $ref: '#/$defs/qualifiedField'
    required:
      - op
      - left
      - right
    type: object
  joinHints:
    additionalProperties: false
    properties:
      algorithms:
        items:
          enum:
            - hash
            - merge
            - lookup
            - batchedLookup
            - nestedLoop
        minItems: 1
        type: array
        uniqueItems: true
    required:
      - algorithms
    type: object
  order:
    additionalProperties: false
    oneOf:
      - required:
          - field
      - not:
          required:
            - source
        required:
          - value
      - not:
          required:
            - source
        required:
          - values
      - not:
          required:
            - source
        required:
          - param
      - not:
          required:
            - source
        required:
          - star
      - not:
          required:
            - source
        required:
          - aggregate
      - not:
          required:
            - source
        required:
          - binary
      - not:
          required:
            - source
        required:
          - query
    properties:
      aggregate:
        $ref: '#/$defs/aggregate'
      binary:
        $ref: '#/$defs/binary'
      desc:
        type: boolean
      field:
        type: string
      param:
        pattern: ^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*$
        type: string
      query:
        $ref: '#/$defs/queryDocument'
      source:
        minLength: 1
        type: string
      star:
        const: true
      value:
        type:
          - string
          - number
          - boolean
          - "null"
      values:
        items:
          type:
            - string
            - number
            - boolean
            - "null"
        type: array
    type: object
  qualifiedField:
    additionalProperties: false
    properties:
      field:
        minLength: 1
        type: string
      source:
        minLength: 1
        type: string
    required:
      - field
      - source
    type: object
  queryDocument:
    additionalProperties: false
    properties:
      as:
        minLength: 1
        type: string
      columns:
        items:
          $ref: '#/$defs/column'
        type: array
      from:
        $ref: '#/$defs/from'
      groupBy:
        items:
          $ref: '#/$defs/expression'
        type: array
      having:
        $ref: '#/$defs/condition'
      limit:
        minimum: 0
        type: integer
      money:
        additionalProperties: false
        properties:
          divisionScale:
            maximum: 18
            minimum: 0
            type: integer
          minorUnitScale:
            maximum: 18
            minimum: 0
            type: integer
          rounding:
            const: halfEven
        required:
          - minorUnitScale
          - divisionScale
          - rounding
        type: object
      offset:
        minimum: 0
        type: integer
      orderBy:
        items:
          $ref: '#/$defs/order'
        type: array
      where:
        $ref: '#/$defs/condition'
    required:
      - from
    type: object
  wildcardProjection:
    additionalProperties: false
    properties:
      exclude:
        items:
          minLength: 1
          type: string
        minItems: 1
        type: array
      source:
        minLength: 1
        type: string
    required:
      - exclude
    type: object
$id: https://dal-go.github.io/dtql/schema.json
$ref: '#/$defs/queryDocument'
$schema: https://json-schema.org/draft/2020-12/schema
description: YAML serialization of dalgo's dal.StructuredQuery (core relational read-only subset).
title: DTQL
