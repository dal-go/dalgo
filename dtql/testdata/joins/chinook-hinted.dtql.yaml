from:
  schema: main
  name: Invoice
  alias: i
  joins:
    - type: inner
      from:
        schema: main
        name: Customer
        alias: c
        joins:
          - type: left
            from: {schema: main, name: Employee, alias: e}
            on:
              - left: {field: SupportRepId, source: c}
                op: '=='
                right: {field: EmployeeId, source: e}
            hints:
              algorithms: [nestedLoop, hash]
      on:
        - left: {field: CustomerId, source: i}
          op: '=='
          right: {field: CustomerId, source: c}
      hints:
        algorithms: [merge, hash]
    - type: left
      from: {schema: main, name: Customer, alias: c2}
      on:
        - left: {field: CustomerId, source: i}
          op: '=='
          right: {field: CustomerId, source: c2}
      hints:
        algorithms: [lookup, hash]
where:
  op: '>='
  left: {field: CustomerId, source: c}
  right: {value: 10}
orderBy:
  - field: InvoiceId
    source: i
    desc: true
limit: 10
columns:
  - field: InvoiceId
    source: i
    as: invoice_id
  - field: FirstName
    source: c
    as: customer
  - field: FirstName
    source: e
    as: employee
