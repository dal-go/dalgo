from:
  name: Invoice
groupBy:
- field: CustomerId
orderBy:
- aggregate:
    function: last
    args:
    - field: Total
    orderBy:
    - field: InvoiceDate
  desc: true
columns:
- field: CustomerId
  as: CustomerId
- aggregate:
    function: last
    args:
    - field: Total
    orderBy:
    - field: InvoiceDate
  as: last_total
