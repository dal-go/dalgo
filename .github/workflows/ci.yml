name: Go CI

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+' # Push events to matching v*, i.e. v20.15.10
  pull_request:
    branches:
      - '**'

jobs:

  strongo_workflow:
    permissions:
      contents: write
    uses: strongo/cicd/.github/workflows/workflow.yml@main

    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
    with:
      require_conventional_pr_title: true
      code_coverage: true
      cgo_enabled: true
      min_test_coverage_percent: 100
      additional_go_test_path: -race ./...
      allowed_imports: |
        # dalgo packages that use its in-memory adapter today, listed one by one so
        # another package still fails. The check cannot tell a package's tests
        # from its code: an allowed package may import it from either.
        github.com/dal-go/dalgo/access github.com/dal-go/dalgo/adapters/dalgo2memory
        github.com/dal-go/dalgo/branchingtest github.com/dal-go/dalgo/adapters/dalgo2memory
        github.com/dal-go/dalgo/dal github.com/dal-go/dalgo/adapters/dalgo2memory
        github.com/dal-go/dalgo/dalgotest github.com/dal-go/dalgo/adapters/dalgo2memory
        github.com/dal-go/dalgo/end2end github.com/dal-go/dalgo/adapters/dalgo2memory
        github.com/dal-go/dalgo/tugql github.com/dal-go/dalgo/adapters/dalgo2memory
